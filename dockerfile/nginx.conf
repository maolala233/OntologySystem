server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html index.htm;
    
    # 添加CORS头部支持
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE';
    add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
    
    # 上传体积上限：与后端单文件 200MB 上限对齐（默认 1MB 会让稍大的 PPT/PDF 直接 413）
    client_max_body_size 200m;

    # 静态文件缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # 关键：将所有/api请求代理到后端容器
    # 使用localhost:3001因为这是在nginx容器内部，backend服务在同一网络中
    location /api {
        proxy_pass http://backend:3001;
        # $http_host 保留端口（$host 会丢）：后端预签名 URL 改写需要完整 host:port
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 问答等 SSE 流式接口：关闭缓冲 + 拉长超时（LLM 生成可超 60s 默认值）
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # CORS预检请求处理
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE';
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }
    
    # MCP 网关（HTTP Streamable）同域反代：容器化部署只暴露 80 时，
    # 控制台端点填 http://<部署IP>/mcp 即可（前端默认推导会拼 :3001，同域部署改一次）
    location /mcp {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streamable HTTP 可能流式返回：关闭缓冲，拉长读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # CORS预检请求处理（与 /api 段保持一致）
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE';
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # MinIO 预签名同域反代（方案C）：后端签发的内网 URL（host=MINIO_ENDPOINT，
    # 即 minio-business:9000）被改写为 http://<部署地址>/minio/...，浏览器全程同源，
    # 无需对外暴露 9010、无 CORS。★ 签名覆盖 Host 头，这里必须原样回传
    # MINIO_ENDPOINT——若 compose 里改了 MINIO_ENDPOINT，此处的 Host 要同步改。
    location /minio/ {
        proxy_pass http://minio-business:9000/;
        proxy_set_header Host minio-business:9000;
        proxy_set_header X-Real-IP $remote_addr;
        # 剥掉 JWT：跟随 302 的 fetch/axios 会把 Authorization 头重发到 /minio，
        # MinIO 见到"查询串签名+请求头认证"两种类型并存会报 400 multiple auth
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA路由支持 - 必须放在最后
    location / {
        try_files $uri $uri/ /index.html;
    }
}