<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>本体平台</title>
    <style>
      /* 确保在所有设备上使用一致的布局 */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }
      /* 防止移动端浏览器自动调整字体大小 */
      body {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
    </style>
    <script>
      /*
       * 老版本浏览器兼容（2026-11-21）：
       * Chrome/Edge < 93、Safari < 15.4 没有 Object.hasOwn，而 react-markdown
       * （本体问答的消息渲染、历史会话列表）在渲染时会直接调用它，缺失就抛
       * TypeError → React 渲染中断 → 白屏。这里在任何模块加载之前补齐。
       * 注意：esbuild 只降级语法，不会给运行时 API 打补丁，所以必须显式 polyfill。
       */
      if (typeof Object.hasOwn !== 'function') {
        Object.defineProperty(Object, 'hasOwn', {
          value: function hasOwn(target, key) {
            if (target == null) {
              throw new TypeError('Cannot convert undefined or null to object');
            }
            return Object.prototype.hasOwnProperty.call(Object(target), key);
          },
          writable: true,
          configurable: true
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
