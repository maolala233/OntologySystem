# ==============================================================================
# Alembic 配置 —— OntologySystem 演进重构（docs/design/02 §6）
# ==============================================================================
# 数据库连接不在本文件维护：
#   默认从 app/core/config.py 的 settings.DATABASE_URL 读取（即 src/backend/.env）；
#   演练/测试时用环境变量 ALEMBIC_DATABASE_URL 覆盖（见 alembic/env.py）。
# 必须在 src/backend 目录下执行 alembic 命令（prepend_sys_path 使 app 可导入）。
[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
